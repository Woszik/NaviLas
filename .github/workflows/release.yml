name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — no workflow heredocs
        run: bash .github/scripts/check_no_workflow_heredocs.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=navilas-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            export RELEASE_KEYSTORE_PATH=release.keystore
          fi
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease --no-daemon

      - name: Compute SHA-256
        id: sha
        run: |
          APK="app/build/outputs/apk/github/release/app-github-release.apk"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Read version metadata
        id: appmeta
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -1 | grep -Eo '[0-9]+')
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        run: |
          # Prefer the "Release X.Y.Z Beta" commit so retagging onto a CI fix keeps correct notes.
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE_COMMIT=$(git log --grep="^Release ${TAG} Beta" -1 --format=%H || true)
          if [ -n "$RELEASE_COMMIT" ]; then
            NOTES=$(bash .github/scripts/first_paragraph_notes.sh "$RELEASE_COMMIT")
          else
            NOTES=$(bash .github/scripts/first_paragraph_notes.sh HEAD)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="NaviLas ${{ steps.appmeta.outputs.version_name }}"
          fi
          python3 .github/scripts/write_update_manifest.py \
            --out latest.json \
            --version-code "${{ steps.appmeta.outputs.version_code }}" \
            --version-name "${{ steps.appmeta.outputs.version_name }}" \
            --apk-url "https://github.com/Woszik/NaviLas-releases/releases/download/v${{ steps.version.outputs.tag }}/${{ steps.version.outputs.apk_name }}" \
            --sha256 "${{ steps.sha.outputs.sha256 }}" \
            --release-notes "$NOTES" \
            --channel beta

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "${{ steps.version.outputs.apk_name }}"
          cp .github/release-notes/beta.md release-notes.md
          sed -i "s/{{TAG}}/${GITHUB_REF_NAME}/" release-notes.md
          if gh release view "v${{ steps.version.outputs.tag }}" --repo Woszik/NaviLas-releases >/dev/null 2>&1; then
            gh release upload "v${{ steps.version.outputs.tag }}" \
              "${{ steps.version.outputs.apk_name }}" \
              --repo Woszik/NaviLas-releases --clobber
          else
            gh release create "v${{ steps.version.outputs.tag }}" \
              "${{ steps.version.outputs.apk_name }}" \
              --repo Woszik/NaviLas-releases \
              --title "Beta ${{ steps.version.outputs.tag }}" \
              --notes-file release-notes.md
          fi

      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          CONTENT=$(base64 -w0 latest.json)
          SHA=$(gh api repos/Woszik/NaviLas-releases/contents/latest.json --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api repos/Woszik/NaviLas-releases/contents/latest.json \
              -X PUT \
              -f message="Update latest.json for v${{ steps.version.outputs.tag }}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api repos/Woszik/NaviLas-releases/contents/latest.json \
              -X PUT \
              -f message="Add latest.json for v${{ steps.version.outputs.tag }}" \
              -f content="$CONTENT"
          fi
